<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>Inventory Lottemart</title>

  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    /* ================================================
       RESET & CSS VARIABEL
    ================================================ */
    *, *::before, *::after {
      box-sizing : border-box;
      margin     : 0;
      padding    : 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg      : #ffffff;
      --bg2     : #f5f5f5;
      --bg3     : #e8e8e8;
      --tx      : #0a0a0a;
      --tx2     : #555555;
      --bd      : #d0d0d0;
      --ac      : #1a1a1a;
      --in      : #16a34a;
      --in-bg   : #f0fdf4;
      --out     : #dc2626;
      --out-bg  : #fef2f2;
      --r-sm    : 4px;
      --r-md    : 6px;
      --r-lg    : 10px;
      --font    : system-ui, -apple-system, sans-serif;
      --mono    : 'Courier New', monospace;
      --touch   : 44px;
    }

    html { font-size: 16px; }

    body {
      font-family    : var(--font);
      background     : var(--bg2);
      color          : var(--tx);
      min-height     : 100dvh;
      padding        : 1rem;
      padding-bottom : 2rem;
    }

    /* ================================================
       LAYOUT
    ================================================ */
    .container { max-width: 760px; margin: 0 auto; }

    /* ================================================
       HEADER
    ================================================ */
    .header {
      display         : flex;
      align-items     : center;
      justify-content : space-between;
      margin-bottom   : 1.25rem;
      padding-bottom  : 0.875rem;
      border-bottom   : 1.5px solid var(--ac);
    }

    .logo {
      font-size      : 15px;
      font-weight    : 600;
      letter-spacing : 0.08em;
      text-transform : uppercase;
    }

    .logo span { font-weight: 400; color: var(--tx2); }

    .clock {
      font-size            : 12px;
      color                : var(--tx2);
      font-variant-numeric : tabular-nums;
      letter-spacing       : 0.05em;
    }

    /* ================================================
       SWITCH MODE MASUK / KELUAR
    ================================================ */
    .switch-row {
      display       : flex;
      margin-bottom : 1rem;
      border        : 1.5px solid var(--ac);
      border-radius : var(--r-md);
      overflow      : hidden;
    }

    .sw-btn {
      flex           : 1;
      padding        : 12px 0;
      font-size      : 13px;
      font-weight    : 500;
      letter-spacing : 0.06em;
      text-transform : uppercase;
      border         : none;
      cursor         : pointer;
      background     : transparent;
      color          : var(--tx2);
      transition     : background 0.15s, color 0.15s;
      min-height     : var(--touch);
    }

    .sw-btn.active-in  { background: var(--in);  color: #fff; }
    .sw-btn.active-out { background: var(--out); color: #fff; }

    /* ================================================
       BADGE MODE AKTIF
    ================================================ */
    .mode-badge {
      display        : inline-flex;
      align-items    : center;
      gap            : 6px;
      font-size      : 11px;
      font-weight    : 500;
      letter-spacing : 0.08em;
      text-transform : uppercase;
      padding        : 4px 10px;
      border-radius  : var(--r-sm);
      margin-bottom  : 0.875rem;
    }

    .mode-badge.in  { background: var(--in-bg);  color: var(--in);  }
    .mode-badge.out { background: var(--out-bg); color: var(--out); }

    .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot.in  { background: var(--in);  }
    .dot.out { background: var(--out); }

    /* ================================================
       FORM CARD
    ================================================ */
    .form-card {
      background    : var(--bg);
      border        : 1px solid var(--bd);
      border-radius : var(--r-lg);
      padding       : 1rem;
      margin-bottom : 1rem;
    }

    .form-row {
      display               : grid;
      grid-template-columns : 1fr auto;
      gap                   : 8px;
      align-items           : flex-end;
      margin-bottom         : 10px;
    }

    .form-grid-2 {
      display               : grid;
      grid-template-columns : 1fr 1fr;
      gap                   : 8px;
      margin-bottom         : 10px;
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; }

    label {
      font-size      : 11px;
      font-weight    : 500;
      letter-spacing : 0.07em;
      text-transform : uppercase;
      color          : var(--tx2);
    }

    input[type="text"],
    input[type="number"],
    input[type="date"] {
      width              : 100%;
      padding            : 10px 12px;
      font-size          : 16px;
      font-family        : var(--mono);
      border             : 1px solid var(--bd);
      border-radius      : var(--r-sm);
      background         : var(--bg);
      color              : var(--tx);
      transition         : border-color 0.15s;
      min-height         : var(--touch);
      -webkit-appearance : none;
      appearance         : none;
    }

    input:focus { outline: none; border-color: var(--ac); }

    .photo-btn {
      display         : flex;
      align-items     : center;
      justify-content : center;
      gap             : 6px;
      padding         : 0 14px;
      height          : var(--touch);
      background      : var(--ac);
      color           : #fff;
      border          : none;
      border-radius   : var(--r-sm);
      cursor          : pointer;
      font-size       : 13px;
      font-weight     : 500;
      white-space     : nowrap;
      transition      : opacity 0.15s;
      flex-shrink     : 0;
    }

    .photo-btn:active { opacity: 0.7; }
    .photo-btn svg    { width: 16px; height: 16px; }

    .photo-preview-wrap {
      display       : none;
      margin-bottom : 10px;
      border        : 1px solid var(--bd);
      border-radius : var(--r-sm);
      overflow      : hidden;
      position      : relative;
    }

    .photo-preview-wrap.show { display: block; }

    .photo-preview-wrap img {
      width      : 100%;
      max-height : 200px;
      object-fit : cover;
      display    : block;
    }

    .photo-remove {
      position        : absolute;
      top             : 6px;
      right           : 6px;
      background      : rgba(0,0,0,0.6);
      color           : #fff;
      border          : none;
      border-radius   : 50%;
      width           : 28px;
      height          : 28px;
      cursor          : pointer;
      font-size       : 14px;
      display         : flex;
      align-items     : center;
      justify-content : center;
    }

    .submit-btn {
      width          : 100%;
      padding        : 13px;
      font-size      : 14px;
      font-weight    : 500;
      letter-spacing : 0.07em;
      text-transform : uppercase;
      border         : none;
      border-radius  : var(--r-md);
      cursor         : pointer;
      transition     : opacity 0.15s, transform 0.1s;
      margin-top     : 4px;
      min-height     : var(--touch);
    }

    .submit-btn.in  { background: var(--in);  color: #fff; }
    .submit-btn.out { background: var(--out); color: #fff; }
    .submit-btn:active { transform: scale(0.98); opacity: 0.88; }

    .stats-row {
      display               : grid;
      grid-template-columns : 1fr 1fr 1fr;
      gap                   : 8px;
      margin-bottom         : 1rem;
    }

    .stat-card {
      background    : var(--bg);
      border        : 1px solid var(--bd);
      border-radius : var(--r-md);
      padding       : 10px 12px;
    }

    .stat-label {
      font-size      : 10px;
      font-weight    : 500;
      letter-spacing : 0.07em;
      text-transform : uppercase;
      color          : var(--tx2);
      margin-bottom  : 4px;
    }

    .stat-val {
      font-size            : 22px;
      font-weight          : 500;
      font-variant-numeric : tabular-nums;
      line-height          : 1;
    }

    .stat-val.in  { color: var(--in);  }
    .stat-val.out { color: var(--out); }

    .section-header {
      display         : flex;
      align-items     : center;
      justify-content : space-between;
      margin-bottom   : 8px;
      flex-wrap       : wrap;
      gap             : 6px;
    }

    .section-title {
      font-size      : 11px;
      font-weight    : 500;
      letter-spacing : 0.08em;
      text-transform : uppercase;
      color          : var(--tx2);
    }

    .btn-actions { display: flex; gap: 6px; }

    .btn-small {
      font-size     : 10px;
      color         : var(--tx2);
      background    : none;
      border        : 1px solid var(--bd);
      border-radius : var(--r-sm);
      padding       : 5px 10px;
      cursor        : pointer;
      transition    : background 0.15s;
      min-height    : 30px;
    }

    .btn-small:active { background: var(--bg3); }

    .filter-row { display: flex; gap: 6px; margin-bottom: 8px; }

    .filter-btn {
      padding        : 6px 12px;
      font-size      : 11px;
      font-weight    : 500;
      letter-spacing : 0.05em;
      text-transform : uppercase;
      border         : 1px solid var(--bd);
      border-radius  : var(--r-sm);
      background     : transparent;
      color          : var(--tx2);
      cursor         : pointer;
      transition     : background 0.15s, color 0.15s;
      min-height     : 32px;
    }

    .filter-btn.active {
      background   : var(--ac);
      color        : #fff;
      border-color : var(--ac);
    }

    .table-wrap {
      background    : var(--bg);
      border        : 1px solid var(--bd);
      border-radius : var(--r-lg);
      overflow      : hidden;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }

    thead th {
      font-size      : 10px;
      font-weight    : 500;
      letter-spacing : 0.07em;
      text-transform : uppercase;
      color          : var(--tx2);
      padding        : 8px 10px;
      text-align     : left;
      border-bottom  : 1px solid var(--bd);
      background     : var(--bg2);
    }

    tbody td {
      padding        : 9px 10px;
      border-bottom  : 0.5px solid var(--bd);
      color          : var(--tx);
      vertical-align : middle;
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td      { background: var(--bg2); }

    .td-bc   { font-family: var(--mono); font-size: 12px; }
    .td-qty  { text-align: right; font-weight: 500; }
    .td-note { color: var(--tx2); font-size: 12px; }

    .td-photo img {
      width: 36px; height: 36px;
      object-fit: cover; border-radius: 3px;
      border: 1px solid var(--bd); cursor: pointer;
    }

    .card-list { display: none; }

    .record-card {
      background    : var(--bg);
      border-bottom : 1px solid var(--bd);
      padding       : 12px;
    }

    .record-card:last-child { border-bottom: none; }

    .rc-top {
      display         : flex;
      align-items     : flex-start;
      justify-content : space-between;
      margin-bottom   : 6px;
      gap             : 8px;
    }

    .rc-left  { flex: 1; }
    .rc-name  { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
    .rc-qty   { font-size: 16px; font-weight: 600; white-space: nowrap; }
    .rc-meta  { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .rc-bc    { font-family: var(--mono); font-size: 11px; color: var(--tx2); }
    .rc-date  { font-size: 11px; color: var(--tx2); }
    .rc-note  { font-size: 11px; color: var(--tx2); font-style: italic; }

    .rc-photo {
      width: 56px; height: 56px;
      object-fit: cover; border-radius: var(--r-sm);
      border: 1px solid var(--bd); cursor: pointer; flex-shrink: 0;
    }

    .tag {
      display        : inline-block;
      font-size      : 10px;
      font-weight    : 500;
      padding        : 2px 7px;
      border-radius  : var(--r-sm);
      text-transform : uppercase;
      letter-spacing : 0.05em;
      white-space    : nowrap;
    }

    .tag.in  { background: var(--in-bg);  color: var(--in);  }
    .tag.out { background: var(--out-bg); color: var(--out); }

    .empty {
      text-align : center;
      padding    : 2.5rem 1rem;
      color      : var(--tx2);
      font-size  : 13px;
    }

    .toast {
      position       : fixed;
      bottom         : 24px;
      left           : 50%;
      transform      : translateX(-50%) translateY(60px);
      background     : var(--ac);
      color          : #fff;
      padding        : 10px 20px;
      border-radius  : var(--r-md);
      font-size      : 13px;
      font-weight    : 500;
      opacity        : 0;
      transition     : transform 0.25s, opacity 0.25s;
      z-index        : 999;
      pointer-events : none;
      white-space    : nowrap;
      max-width      : calc(100vw - 32px);
      text-align     : center;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .photo-modal {
      display         : none;
      position        : fixed;
      inset           : 0;
      background      : rgba(0,0,0,0.92);
      z-index         : 200;
      align-items     : center;
      justify-content : center;
      padding         : 1rem;
    }

    .photo-modal.open { display: flex; }

    .photo-modal img {
      max-width     : 100%;
      max-height    : 90vh;
      border-radius : var(--r-md);
      object-fit    : contain;
    }

    .photo-modal-close {
      position        : fixed;
      top             : 16px;
      right           : 16px;
      background      : rgba(255,255,255,0.15);
      border          : none;
      color           : #fff;
      font-size       : 20px;
      width           : 36px;
      height          : 36px;
      border-radius   : 50%;
      cursor          : pointer;
      display         : flex;
      align-items     : center;
      justify-content : center;
    }

    .scan-overlay { display: none; position: fixed; inset: 0; }

    @media (max-width: 600px) {
      body { padding: 0.75rem; padding-bottom: 2rem; }
      .stats-row  { gap: 6px; }
      .stat-card  { padding: 8px 10px; }
      .stat-label { font-size: 9px; }
      .stat-val   { font-size: 18px; }
      .col-hide   { display: none; }
    }

    @media (max-width: 480px) {
      .form-grid-2   { grid-template-columns: 1fr; }
      .table-desktop { display: none; }
      .card-list     { display: block; }
      .stat-val      { font-size: 16px; }
      .stat-label    { font-size: 8px; }
    }

    @supports (padding: env(safe-area-inset-bottom)) {
      body   { padding-bottom: calc(2rem + env(safe-area-inset-bottom)); }
      .toast { bottom: calc(24px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>

<body>
<div class="container">

  <header class="header">
    <div class="logo">Inventory <span>Lottemart</span></div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <div class="switch-row">
    <button class="sw-btn active-in" id="btn-in"  onclick="setMode('in')">▲ Data Masuk</button>
    <button class="sw-btn"           id="btn-out" onclick="setMode('out')">▼ Data Keluar</button>
  </div>

  <div class="mode-badge in" id="mode-badge">
    <span class="dot in"></span> Mode: Data Masuk
  </div>

  <div class="form-card">
    <div class="form-row">
      <div class="form-group">
        <label for="inp-barcode">Barcode / Kode Barang</label>
        <input
          type="text" id="inp-barcode"
          placeholder="Ketik barcode..."
          autocomplete="off" autocorrect="off"
          autocapitalize="off" spellcheck="false"
          inputmode="text"
        />
      </div>

      <button class="photo-btn" onclick="triggerPhoto()" title="Ambil / Upload Foto Barang">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Foto
      </button>

      <input
        type="file" id="inp-photo"
        accept="image/*" capture="environment"
        style="display:none"
        onchange="onPhotoSelected(event)"
      />
    </div>

    <div class="photo-preview-wrap" id="photo-preview-wrap">
      <img id="photo-preview" src="" alt="Preview foto" />
      <button class="photo-remove" onclick="removePhoto()">✕</button>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label for="inp-name">Nama Barang</label>
        <input type="text" id="inp-name" placeholder="Nama barang (opsional)" />
      </div>
      <div class="form-group">
        <label for="inp-qty">Qty</label>
        <input type="number" id="inp-qty" placeholder="0" min="1" value="1" inputmode="numeric" />
      </div>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label for="inp-date">Tanggal</label>
        <input type="date" id="inp-date" />
      </div>
      <div class="form-group">
        <label for="inp-note">Keterangan</label>
        <input type="text" id="inp-note" placeholder="Opsional..." />
      </div>
    </div>

    <button class="submit-btn in" id="submit-btn" onclick="submitData()">
      + Tambah Data Masuk
    </button>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total</div>
      <div class="stat-val" id="stat-total">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Masuk</div>
      <div class="stat-val in" id="stat-in">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Keluar</div>
      <div class="stat-val out" id="stat-out">0</div>
    </div>
  </div>

  <div class="section-header">
    <span class="section-title">Riwayat Inputan</span>
    <div class="btn-actions">
      <button class="btn-small" onclick="exportExcel()">Export Excel</button>
      <button class="btn-small" onclick="clearAll()">Hapus Semua</button>
    </div>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" id="f-all" onclick="setFilter('all')">Semua</button>
    <button class="filter-btn"        id="f-in"  onclick="setFilter('in')">Masuk</button>
    <button class="filter-btn"        id="f-out" onclick="setFilter('out')">Keluar</button>
  </div>

  <div id="log-wrap"></div>

</div>

<div class="photo-modal" id="photo-modal" onclick="closePhotoModal()">
  <button class="photo-modal-close">✕</button>
  <img id="photo-modal-img" src="" alt="Foto barang" />
</div>

<div class="scan-overlay" id="scan-overlay"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

const DB_KEY  = 'inv_data_v1';
const DEBOUNCE = 1500;

let mode      = 'in';
let filter    = 'all';
let photoData = null;

let camStream = null;
let scanTimer = null;
let lastCode  = '';
let lastTime  = 0;
let ENGINE    = 'none';

function getDB() {
  try { return JSON.parse(localStorage.getItem(DB_KEY) || '[]'); }
  catch { return []; }
}

function saveDB(d) { localStorage.setItem(DB_KEY, JSON.stringify(d)); }

function setMode(m) {
  mode = m;
  document.getElementById('btn-in').className  = 'sw-btn' + (m === 'in'  ? ' active-in'  : '');
  document.getElementById('btn-out').className = 'sw-btn' + (m === 'out' ? ' active-out' : '');
  const badge = document.getElementById('mode-badge');
  badge.className = 'mode-badge ' + m;
  badge.innerHTML = `<span class="dot ${m}"></span> Mode: Data ${m === 'in' ? 'Masuk' : 'Keluar'}`;
  const btn = document.getElementById('submit-btn');
  btn.className   = 'submit-btn ' + m;
  btn.textContent = m === 'in' ? '+ Tambah Data Masuk' : '- Tambah Data Keluar';
}

function setFilter(f) {
  filter = f;
  ['all', 'in', 'out'].forEach(x => {
    document.getElementById('f-' + x).className = 'filter-btn' + (x === f ? ' active' : '');
  });
  renderLog();
}

function triggerPhoto() {
  document.getElementById('inp-photo').click();
}

function onPhotoSelected(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const MAX_W   = 800;
      const ratio   = Math.min(1, MAX_W / img.width);
      const canvas  = document.createElement('canvas');
      canvas.width  = Math.round(img.width  * ratio);
      canvas.height = Math.round(img.height * ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      photoData = canvas.toDataURL('image/jpeg', 0.8);

      document.getElementById('photo-preview').src = photoData;
      document.getElementById('photo-preview-wrap').classList.add('show');
      toast('Foto dipilih!');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function removePhoto() {
  photoData = null;
  document.getElementById('photo-preview').src = '';
  document.getElementById('photo-preview-wrap').classList.remove('show');
}

function openPhotoModal(src) {
  document.getElementById('photo-modal-img').src = src;
  document.getElementById('photo-modal').classList.add('open');
}

function closePhotoModal() {
  document.getElementById('photo-modal').classList.remove('open');
}

// ↓↓↓ MODIFIKASI SUBMIT DATA - NAMA FILE = BARCODE.jpg ↓↓↓
function submitData() {
  const barcode = document.getElementById('inp-barcode').value.trim();
  const name    = document.getElementById('inp-name').value.trim();
  const qty     = parseInt(document.getElementById('inp-qty').value) || 0;
  const date    = document.getElementById('inp-date').value;
  const note    = document.getElementById('inp-note').value.trim();

  if (!barcode) { toast('Barcode wajib diisi!'); return; }
  if (qty < 1)  { toast('Qty minimal 1!');       return; }

  const record = {
    id        : Date.now(),
    mode      : mode,
    barcode   : barcode,
    name      : name || barcode,
    qty       : qty,
    date      : date || new Date().toISOString().slice(0, 10),
    note      : note,
    time      : new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
    photo     : photoData || null,
    photoName : null  // ← BARU: Nama file gambar
  };

  // ↓↓↓ DOWNLOAD GAMBAR DENGAN NAMA BARCODE.jpg ↓↓↓
  if (photoData && barcode) {
    record.photoName = `${barcode}.jpg`;  // HANYA BARCODE.jpg
    downloadImage(photoData, record.photoName);
  }

  const db = getDB();
  db.unshift(record);
  saveDB(db);

  ['inp-barcode', 'inp-name', 'inp-note'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('inp-qty').value = '1';
  removePhoto();

  renderLog();
  updateStats();
  toast(mode === 'in' ? 'Data masuk ditambahkan!' : 'Data keluar ditambahkan!');
  document.getElementById('inp-barcode').focus();
}

// ↓↓↓ FUNGSI BARU: Download gambar ↓↓↓
function downloadImage(base64Data, filename) {
  const link = document.createElement('a');
  link.href = base64Data;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  toast(`Foto disimpan: ${filename}`);
}
// ↑↑↑ AKHIR MODIFIKASI ↑↑↑

function renderLog() {
  const db   = getDB();
  const data = filter === 'all' ? db : db.filter(r => r.mode === filter);
  const wrap = document.getElementById('log-wrap');

  if (!data.length) {
    wrap.innerHTML = '<div class="empty">Belum ada inputan</div>';
    return;
  }

  wrap.innerHTML = window.innerWidth <= 480
    ? renderCards(data)
    : renderTable(data);
}

function renderTable(data) {
  let h = `
    <div class="table-wrap table-desktop">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Waktu</th>
            <th>Barcode</th>
            <th>Nama Barang</th>
            <th style="text-align:right">Qty</th>
            <th>Tipe</th>
            <th class="col-hide">Keterangan</th>
            <th>Foto</th>
          </tr>
        </thead>
        <tbody>
  `;

  data.forEach(r => {
    // ↓↓↓ TAMPILKAN NAMA FILE BARCODE.jpg ↓↓↓
    const foto = r.photo
      ? `<img src="${r.photo}" onclick="openPhotoModal('${r.photo}')"
             title="${r.photoName || 'Foto'}" 
             style="width:36px;height:36px;object-fit:cover;border-radius:3px;
                    border:1px solid var(--bd);cursor:pointer;" />`
      : `<span style="color:var(--tx2);font-size:11px;">—</span>`;

    h += `
      <tr>
        <td>${r.date}</td>
        <td>${r.time || '-'}</td>
        <td class="td-bc">${r.barcode}</td>
        <td>${r.name}</td>
        <td class="td-qty">${r.qty}</td>
        <td><span class="tag ${r.mode}">${r.mode === 'in' ? 'Masuk' : 'Keluar'}</span></td>
        <td class="td-note col-hide">${r.note || '-'}</td>
        <td class="td-photo">${foto}</td>
      </tr>
    `;
  });

  return h + '</tbody></table></div>';
}

function renderCards(data) {
  let h = '<div class="table-wrap card-list">';

  data.forEach(r => {
    const foto = r.photo
      ? `<img class="rc-photo" src="${r.photo}"
             onclick="openPhotoModal('${r.photo}')" 
             title="${r.photoName || 'Foto'}" alt="foto" />`
      : '';

    h += `
      <div class="record-card">
        <div class="rc-top">
          <div class="rc-left">
            <div class="rc-name">${r.name}</div>
          </div>
          <div class="rc-qty">×${r.qty}</div>
          ${foto}
        </div>
        <div class="rc-meta">
          <span class="tag ${r.mode}">${r.mode === 'in' ? 'Masuk' : 'Keluar'}</span>
          <span class="rc-bc">${r.barcode}</span>
          <span class="rc-date">${r.date} ${r.time || ''}</span>
          ${r.note ? `<span class="rc-note">${r.note}</span>` : ''}
        </div>
      </div>
    `;
  });

  return h + '</div>';
}

function updateStats() {
  const db = getDB();
  document.getElementById('stat-total').textContent = db.length;
  document.getElementById('stat-in').textContent    = db.filter(r => r.mode === 'in').length;
  document.getElementById('stat-out').textContent   = db.filter(r => r.mode === 'out').length;
}

function clearAll() {
  if (!confirm('Yakin ingin menghapus semua data riwayat?')) return;
  saveDB([]);
  renderLog();
  updateStats();
  toast('Semua data berhasil dihapus');
}

// ↓↓↓ MODIFIKASI EXPORT EXCEL - TAMBAH KOLOM FOTO ↓↓↓
function exportExcel() {
  if (typeof XLSX === 'undefined') {
    toast('Library Excel belum dimuat, coba refresh');
    return;
  }

  const db = getDB();
  if (!db.length) { toast('Tidak ada data untuk diexport'); return; }

  const rows = db.map((r, i) => ({
    'No'          : i + 1,
    'Tanggal'     : r.date,
    'Waktu'       : r.time || '-',
    'Barcode'     : r.barcode,
    'Nama Barang' : r.name,
    'Qty'         : r.qty,
    'Tipe'        : r.mode === 'in' ? 'Masuk' : 'Keluar',
    'Keterangan'  : r.note || '-',
    'Foto'        : r.photoName || '-'  // ← NAMA FILE BARCODE.jpg
  }));

  const ws1 = XLSX.utils.json_to_sheet(rows);

  ws1['!cols'] = [
    { wch: 5  },  // No
    { wch: 13 },  // Tanggal
    { wch: 8  },  // Waktu
    { wch: 20 },  // Barcode
    { wch: 30 },  // Nama Barang
    { wch: 7  },  // Qty
    { wch: 10 },  // Tipe
    { wch: 28 },  // Keterangan
    { wch: 22 }   // Foto - BARCODE.jpg
  ];

  const totalMasuk  = db.filter(r => r.mode === 'in').length;
  const totalKeluar = db.filter(r => r.mode === 'out').length;
  const totalFoto   = db.filter(r => r.photoName).length;
  const qtyMasuk    = db.filter(r => r.mode === 'in').reduce((s, r) => s + r.qty, 0);
  const qtyKeluar   = db.filter(r => r.mode === 'out').reduce((s, r) => s + r.qty, 0);
  const tglExport   = new Date().toLocaleDateString('id-ID', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
  });

  const summary = [
    ['RINGKASAN INVENTORY LOTTEMART'],
    [],
    ['Tanggal Export', tglExport],
    ['Total Foto', totalFoto],
    [],
    ['Keterangan',     'Jumlah Transaksi', 'Total Qty', 'Foto'],
    ['Data Masuk',     totalMasuk,          qtyMasuk,   db.filter(r => r.mode === 'in' && r.photoName).length],
    ['Data Keluar',    totalKeluar,          qtyKeluar,  db.filter(r => r.mode === 'out' && r.photoName).length],
    ['Total',          db.length,            qtyMasuk + qtyKeluar, totalFoto],
  ];

  const ws2 = XLSX.utils.aoa_to_sheet(summary);

  ws2['!cols'] = [
    { wch: 22 },
    { wch: 20 },
    { wch: 12 },
    { wch: 8  }
  ];

  const wb       = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws1, 'Data Inventory');
  XLSX.utils.book_append_sheet(wb, ws2, 'Ringkasan');

  const filename = `Inventory_Lottemart_${new Date().toISOString().slice(0, 10)}.xlsx`;
  XLSX.writeFile(wb, filename);
  toast(`${totalFoto} foto (barcode.jpg) siap di folder Downloads!`);
}
// ↑↑↑ AKHIR MODIFIKASI ↑↑↑

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

document.getElementById('inp-barcode').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('inp-qty').focus();
});

document.getElementById('inp-qty').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitData();
});

let rTimer;
window.addEventListener('resize', () => {
  clearTimeout(rTimer);
  rTimer = setTimeout(renderLog, 200);
});

function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('id-ID');
}

(function init() {
  document.getElementById('inp-date').value = new Date().toISOString().slice(0, 10);
  updateClock();
  setInterval(updateClock, 1000);
  renderLog();
  updateStats();
})();
</script>
